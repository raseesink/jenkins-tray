name: Desktop distributions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore src/JenkinsTray.Core.Tests/JenkinsTray.Core.Tests.csproj --locked-mode
      - run: dotnet test src/JenkinsTray.Core.Tests/JenkinsTray.Core.Tests.csproj -c Release --no-restore
      - run: dotnet restore src/JenkinsTray.Desktop.Tests/JenkinsTray.Desktop.Tests.csproj --locked-mode
      - run: dotnet test src/JenkinsTray.Desktop.Tests/JenkinsTray.Desktop.Tests.csproj -c Release --no-restore
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - shell: pwsh
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: JenkinsTray-win-x64
          path: artifacts/JenkinsTray-win-x64.zip
  macos:
    runs-on: macos-26
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: sudo dotnet workload install macos
      - run: sh scripts/publish-macos.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: JenkinsTray-${{ matrix.rid }}
          path: artifacts/JenkinsTray-${{ matrix.rid }}.zip
